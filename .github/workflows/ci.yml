name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (builds first via pretest)
        run: npm test

      - name: Check version consistency
        run: |
          PKG=$(jq -r .version package.json)
          for v in "$(jq -r .version server.json)" \
                   "$(jq -r '.packages[0].version' server.json)" \
                   "$(jq -r .version manifest.json)" \
                   "$(jq -r .version .claude-plugin/plugin.json)" \
                   "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"; do
            if [ "$v" != "$PKG" ]; then
              echo "::error::Version mismatch: package.json has $PKG, found $v (run npm run sync-versions)"
              exit 1
            fi
          done

      - name: Validate MCPB manifest
        run: npx --yes @anthropic-ai/mcpb validate manifest.json
