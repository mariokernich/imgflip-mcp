name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (builds first via pretest)
        run: pnpm test

      - name: Check version consistency
        run: |
          PKG=$(jq -r .version package.json)
          for v in "$(jq -r .version server.json)" \
                   "$(jq -r '.packages[0].version' server.json)" \
                   "$(jq -r .version manifest.json)" \
                   "$(jq -r .version .claude-plugin/plugin.json)" \
                   "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"; do
            if [ "$v" != "$PKG" ]; then
              echo "::error::Version mismatch: package.json has $PKG, found $v (run pnpm run sync-versions)"
              exit 1
            fi
          done

      - name: Validate MCPB manifest
        run: pnpm dlx @anthropic-ai/mcpb validate manifest.json
