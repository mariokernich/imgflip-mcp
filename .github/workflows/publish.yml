# Release pipeline: push a tag like v1.2.3 and this workflow will
#   1. verify the tag matches the versions in package.json / server.json / manifest.json
#   2. build and publish the package to npm (with provenance)
#   3. publish the server metadata to the official MCP Registry
#      (which feeds the GitHub MCP Registry used by Copilot/VS Code)
#   4. build the Claude Desktop Extension (.mcpb) and attach it to a GitHub release
#
# Required repository secret: NPM_TOKEN (npm access token with publish rights).
# The MCP Registry step needs no secret — it authenticates via GitHub OIDC.
name: Publish

on:
  push:
    tags:
      - "v*"
  # Fallback for environments that can't push tags: dispatch with the tag
  # name and the workflow creates the tag itself (via gh release create).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0 (created on this commit if missing)'
        required: true
        type: string

permissions:
  contents: write # create the GitHub release with the .mcpb asset
  id-token: write # OIDC token for npm provenance + MCP Registry login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that all version fields match the tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG=$(jq -r .version package.json)
          SRV=$(jq -r .version server.json)
          SRV_PKG=$(jq -r '.packages[0].version' server.json)
          MAN=$(jq -r .version manifest.json)
          echo "tag=$TAG_VERSION package.json=$PKG server.json=$SRV/$SRV_PKG manifest.json=$MAN"
          for v in "$PKG" "$SRV" "$SRV_PKG" "$MAN"; do
            if [ "$v" != "$TAG_VERSION" ]; then
              echo "::error::Version mismatch: expected $TAG_VERSION, found $v"
              exit 1
            fi
          done

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # npm (not pnpm) is used for the publish itself: npm's --provenance
      # support is the most mature and works with setup-node's registry-url
      # + NODE_AUTH_TOKEN wiring. Skipping already-published versions keeps
      # workflow re-runs safe after a partial failure further down.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if npm view "imgflip-mcp@${RELEASE_TAG#v}" version >/dev/null 2>&1; then
            echo "imgflip-mcp@${RELEASE_TAG#v} is already on npm — skipping publish"
          else
            npm publish --provenance --access public
          fi

      # Release assets are named with amd64/arm64, while uname -m reports
      # x86_64/aarch64 — hence the explicit mapping.
      - name: Publish to the MCP Registry
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64) ARCH=arm64 ;;
          esac
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_${ARCH}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # node-linker=hoisted gives a flat, symlink-free node_modules so the
      # .mcpb zip contains real files (pnpm's default layout uses symlinks).
      - name: Build Claude Desktop Extension (.mcpb)
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          rm -rf node_modules
          pnpm install --prod --frozen-lockfile --config.node-linker=hoisted
          pnpm dlx @anthropic-ai/mcpb pack . "imgflip-mcp-${RELEASE_TAG}.mcpb"

      # On workflow_dispatch the tag doesn't exist yet — --target makes
      # gh release create it on the dispatched commit.
      - name: Create GitHub release with the .mcpb asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "imgflip-mcp-${RELEASE_TAG}.mcpb" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
